<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Provider review queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Mulish:wght@400;500;600;700;800&display=swap">
<style>
/* Visual language: dark hero shell, pill nav, stat tiles, soft status pills, lifted cards (reference A);
   sage page tint, serif card titles, green insights panel, range bars, activity list (reference B). */
:root{
  --bg:#eef1ee;--card:#ffffff;--sub:#f4f6f4;--sub-2:#e8ebe8;--line:#e3e7e3;
  --ink:#0f1116;--ink-2:#4a5160;--quiet:#7f8691;
  --solid:#0f1116;--solid-ink:#ffffff;
  --hero:#0b0e1a;--hero-2:#1a2138;--hero-mute:rgba(255,255,255,.64);--hero-line:rgba(255,255,255,.14);--hero-tile:rgba(255,255,255,.055);
  --violet:#7b5cf6;--violet-hover:#6947ea;--violet-soft:#efebff;--violet-ink:#5f3fe4;--lav:#dcd3ff;--lav-2:#c7b9ff;--lav-ink:#3b2a8a;
  --green:#2fb463;--green-soft:#e1f5e8;--green-ink:#147a3c;
  --amber-soft:#fff1d0;--amber-ink:#9a6200;--amber:#f5b100;
  --pink:#f2477f;--pink-soft:#ffe5ed;--pink-ink:#c81f55;
  --blue-soft:#e5eeff;--blue-ink:#2a60cc;
  --grey-soft:#eef0f2;--grey-ink:#5f6672;
  --panel-1:#6aa56d;--panel-2:#3d7a46;
  --track:#e6eae6;--band:#b9cdb9;--warm:#f6c9bd;--dot:#c5cbd3;
  --sans:"Mulish","Nunito Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --serif:"Lora","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --r:20px;--r-sm:14px;
  --soft:0 1px 2px rgba(15,17,22,.04);
  --lift:0 30px 50px -24px rgba(15,17,22,.38),0 10px 20px -12px rgba(15,17,22,.14);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0d12;--card:#151922;--sub:#1c212b;--sub-2:#262c38;--line:#272d39;
  --ink:#eef0f4;--ink-2:#b8bfcb;--quiet:#8b93a1;--solid:#eef0f4;--solid-ink:#0f1116;
  --hero:#06080e;--hero-2:#151b31;
  --violet-soft:#2a2352;--violet-ink:#bcaaff;--lav:#51458f;--lav-2:#5f52a3;--lav-ink:#ece8ff;
  --green-soft:#15301f;--green-ink:#74dd9c;--amber-soft:#3a2b0b;--amber-ink:#f3c65e;
  --pink-soft:#3e1627;--pink-ink:#ff92b6;--blue-soft:#162949;--blue-ink:#93b7ff;--grey-soft:#242a35;--grey-ink:#a8b0bc;
  --panel-1:#4f8c54;--panel-2:#2a5a31;--track:#2a303c;--band:#4d6650;--warm:#6b3c33;--dot:#465061;
  --soft:0 0 0 1px rgba(255,255,255,.03);--lift:0 30px 50px -24px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --bg:#0b0d12;--card:#151922;--sub:#1c212b;--sub-2:#262c38;--line:#272d39;
  --ink:#eef0f4;--ink-2:#b8bfcb;--quiet:#8b93a1;--solid:#eef0f4;--solid-ink:#0f1116;
  --hero:#06080e;--hero-2:#151b31;
  --violet-soft:#2a2352;--violet-ink:#bcaaff;--lav:#51458f;--lav-2:#5f52a3;--lav-ink:#ece8ff;
  --green-soft:#15301f;--green-ink:#74dd9c;--amber-soft:#3a2b0b;--amber-ink:#f3c65e;
  --pink-soft:#3e1627;--pink-ink:#ff92b6;--blue-soft:#162949;--blue-ink:#93b7ff;--grey-soft:#242a35;--grey-ink:#a8b0bc;
  --panel-1:#4f8c54;--panel-2:#2a5a31;--track:#2a303c;--band:#4d6650;--warm:#6b3c33;--dot:#465061;
  --soft:0 0 0 1px rgba(255,255,255,.03);--lift:0 30px 50px -24px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:6px}
main:focus{outline:none}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{flex:none}
.frame{max-width:1440px;margin:0 auto;padding:20px 24px 28px}

/* ---------- hero shell ---------- */
.hero{position:relative;background:radial-gradient(110% 150% at 88% -30%,var(--hero-2) 0%,var(--hero) 58%);color:#fff;border-radius:26px;padding:14px 24px 26px;isolation:isolate;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(40% 60% at 50% 0%,rgba(123,92,246,.10),transparent 70%);z-index:-1}
.top{display:flex;align-items:center;gap:16px;min-height:52px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;text-decoration:none;color:#fff;white-space:nowrap;letter-spacing:-.01em}
.logo i{width:32px;height:32px;border-radius:50%;background:var(--violet);display:grid;place-items:center;box-shadow:0 0 0 4px rgba(123,92,246,.18)}
.nav{display:flex;gap:4px;margin:0 auto;overflow-x:auto;scrollbar-width:none;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:8px 16px;border-radius:12px;color:var(--hero-mute);text-decoration:none;font-size:13.5px;font-weight:600;white-space:nowrap;transition:background .2s,color .2s}
.nav a:hover{color:#fff;background:rgba(255,255,255,.04)}
.nav a[aria-current=page]{background:rgba(255,255,255,.10);color:#fff}
.icons{display:flex;gap:8px}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--hero-line);background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;position:relative;transition:background .2s,border-color .2s;text-decoration:none}
.ib:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.3)}
.ib .badge{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;border-radius:10px;background:var(--pink);font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid var(--hero);line-height:1}
.hb{padding-top:30px}
.hb-row{display:flex;align-items:flex-end;justify-content:space-between;gap:18px 28px;flex-wrap:wrap}
.hb h1{font-size:clamp(26px,3vw,36px);line-height:1.12;font-weight:800;letter-spacing:-.025em;margin:0}
.hb .lead{color:var(--hero-mute);margin:10px 0 0;max-width:62ch;font-size:15px}
.hact{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;color:#fff;font-size:13.5px;font-weight:600;white-space:nowrap;margin-right:8px}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--violet);color:#fff;border:0;border-radius:14px;padding:12px 20px;font-weight:700;font-size:14px;text-decoration:none;cursor:pointer;transition:background .2s,transform .2s;white-space:nowrap}
.cta:hover{background:var(--violet-hover);transform:translateY(-1px)}
.wpill{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#0f1116;border:0;border-radius:999px;padding:0 16px;height:42px;font-weight:700;font-size:13.5px;cursor:pointer;text-decoration:none;white-space:nowrap}
.wpill select{appearance:none;-webkit-appearance:none;border:0;background:transparent;font-weight:700;font-size:13.5px;color:#0f1116;cursor:pointer;padding-right:4px}
.wpill select:focus-visible{outline:none}
.wpill:focus-within{outline:3px solid var(--lav-2);outline-offset:2px}
.ib.light{background:#fff;color:#0f1116;border-color:#fff;width:42px;height:42px}
.ib.light:hover{background:#e9e9ee}
.ib[aria-disabled=true]{opacity:.35;pointer-events:none}
.crumbs{display:flex;align-items:center;gap:8px;color:var(--hero-mute);font-size:13.5px;flex-wrap:wrap;margin-bottom:14px}
.crumbs a{color:var(--hero-mute);text-decoration:none;display:inline-flex;align-items:center;gap:8px}.crumbs a:hover{color:#fff}
.crumbs b{color:#fff;font-weight:700}
.hb .pls{display:inline-flex;gap:8px;vertical-align:middle;margin-left:12px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:24px}
.tile{background:var(--hero-tile);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr;gap:14px;min-height:98px;color:#fff;text-align:left;font:inherit;min-width:0}
button.tile{cursor:pointer;transition:background .2s,border-color .2s,transform .2s}
button.tile:hover{background:rgba(255,255,255,.09);transform:translateY(-2px)}
.tile[aria-pressed=true]{border-color:rgba(160,138,255,.75);background:rgba(123,92,246,.17)}
.tile .lab{grid-column:1/-1;font-size:13px;font-weight:600;color:rgba(255,255,255,.88)}
.tile .num{font-size:30px;font-weight:800;line-height:1;align-self:end;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .num small{font-size:13px;font-weight:600;color:var(--hero-mute);margin-left:6px;letter-spacing:0}
.tile .ic{align-self:end;width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.ic-violet{background:rgba(123,92,246,.24);color:#c3b5ff}.ic-pink{background:rgba(242,71,127,.2);color:#ff94b8}
.ic-amber{background:rgba(245,177,0,.18);color:#ffcf5c}.ic-green{background:rgba(47,180,99,.2);color:#7fe6a6}
.notice{margin-top:16px;background:var(--amber-soft);color:var(--ink);border-radius:var(--r-sm);padding:12px 16px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.notice svg{color:var(--amber-ink);margin-top:2px}

/* ---------- cards and layout ---------- */
main{display:block;margin-top:16px}
.card{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--soft);min-width:0}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:10px 14px;margin-bottom:16px;flex-wrap:wrap}
.ct{font-family:var(--serif);font-weight:500;font-size:19px;line-height:1.25;margin:0;letter-spacing:-.005em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cs{color:var(--quiet);font-size:13px;margin-top:3px;max-width:70ch}
.count-chip{font-family:var(--sans);font-size:12px;font-weight:700;background:var(--sub);color:var(--ink-2);border-radius:8px;padding:2px 8px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.ov{display:grid;grid-template-columns:minmax(0,2.15fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.pg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.pg .full{grid-column:1/-1}.pg .two{grid-column:span 2}
.pg .panel{grid-column:3;grid-row:1/span 2;align-self:stretch}
@media (max-width:1100px){
  .ov{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stack{display:contents}
  .o1{order:1;grid-column:1/-1}.o2{order:2}.o3{order:3;grid-column:1/-1}.o4{order:4;grid-column:1/-1}.o5{order:5}.o6{order:6;grid-column:1/-1}
  .pg{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pg .panel{grid-column:2;grid-row:1/span 2}
  .pg .two{grid-column:1/-1}
}
@media (max-width:720px){
  .ov,.pg{grid-template-columns:minmax(0,1fr)}
  .ov>*,.pg>*,.pg .panel{grid-column:1/-1!important;grid-row:auto!important}
  .o2b{order:2}
}

/* buttons, pills, inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:10px 16px;font-weight:700;font-size:13.5px;cursor:pointer;text-decoration:none;border:1px solid var(--line);background:var(--card);color:var(--ink);transition:background .2s,color .2s,border-color .2s;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.solid{background:var(--solid);color:var(--solid-ink);border-color:var(--solid)}
.btn.solid:hover{opacity:.9}
.btn.pill{border-radius:999px}
.btn.wide{width:100%}
.btn.sm{padding:7px 12px;font-size:13px}
.circ{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink);transition:background .2s,border-color .2s}
.circ:hover:not(:disabled){border-color:var(--ink-2)}
.circ:disabled{opacity:.35;cursor:default}
.pl{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;line-height:1.35}
.pl-audit{background:var(--pink-soft);color:var(--pink-ink)}
.pl-desk{background:var(--amber-soft);color:var(--amber-ink)}
.pl-mon{background:var(--blue-soft);color:var(--blue-ink)}
.pl-none{background:var(--grey-soft);color:var(--grey-ink)}
.pl-violet{background:var(--violet-soft);color:var(--violet-ink)}
.pl-green{background:var(--green-soft);color:var(--green-ink)}
.pl-pink{background:var(--pink-soft);color:var(--pink-ink)}
.pl-white{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.pl-dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.hero .pl-none{background:rgba(255,255,255,.12);color:#fff}
.sel{position:relative;display:inline-flex;align-items:center}
.sel select{appearance:none;-webkit-appearance:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 34px 8px 14px;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink);max-width:100%}
.sel select:hover{border-color:var(--ink-2)}
.sel svg{position:absolute;right:11px;pointer-events:none;color:var(--quiet)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-width:0;flex:0 1 280px}
.search:focus-within{border-color:var(--violet);box-shadow:0 0 0 3px var(--violet-soft)}
.search input{border:0;background:transparent;padding:9px 0;outline:none;font-weight:600;font-size:13.5px;min-width:0;width:100%}
.search svg{color:var(--quiet)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.av-h{background:var(--violet-soft);color:var(--violet-ink)}
.av-o{background:var(--green-soft);color:var(--green-ink)}
.av-i{background:var(--blue-soft);color:var(--blue-ink)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{font-weight:800;letter-spacing:.01em;white-space:nowrap}
.who small{display:block;color:var(--quiet);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who>div{min-width:0}
.subc{background:var(--sub);border-radius:12px;padding:10px 12px;min-width:0}
.subc>span{display:block;color:var(--quiet);font-size:12px}
.subc b{display:block;font-size:15px;font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;background:var(--solid);color:var(--solid-ink);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;z-index:20;pointer-events:none;transition:opacity .25s,transform .25s;display:flex;gap:8px;align-items:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.tip{position:fixed;pointer-events:none;background:#0f1116;color:#fff;font-size:12.5px;font-weight:600;padding:7px 11px;border-radius:10px;z-index:9;max-width:19rem;display:none;box-shadow:0 10px 24px -10px rgba(0,0,0,.5)}
kbd{font:inherit;font-size:11.5px;font-weight:700;border:1px solid var(--hero-line);border-bottom-width:2px;border-radius:5px;padding:0 5px}

/* ---------- overview ---------- */
.trow{display:grid;grid-template-columns:1fr 1fr 1.45fr 1.45fr 1.45fr;gap:16px}
.act{border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:700;font-size:14px;text-decoration:none;border:0;cursor:pointer;min-height:132px;padding:14px;text-align:center;transition:transform .25s,box-shadow .25s}
.act:hover{transform:translateY(-3px);box-shadow:var(--lift)}
.act small{font-weight:600;font-size:11.5px;opacity:.75}
.act.green{background:var(--green);color:#fff}
.act.black{background:#0f1116;color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .act.black{background:#000;box-shadow:inset 0 0 0 1px #262b36}}
:root[data-theme="dark"] .act.black{background:#000;box-shadow:inset 0 0 0 1px #262b36}
.stat{display:flex;flex-direction:column;min-height:132px}
.stat h3{font-size:14px;font-weight:800;margin:0;line-height:1.3}
.stat p{font-size:12.5px;color:var(--quiet);margin-top:2px}
.stat .big{margin-top:auto;display:flex;align-items:center;gap:10px;padding-top:14px;flex-wrap:wrap}
.stat .big b{font-size:40px;font-weight:800;letter-spacing:-.035em;line-height:1}
.stat .big b small{font-size:16px;color:var(--quiet);letter-spacing:0;margin-left:2px}
.delta{font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap}
.d-up{background:var(--green-soft);color:var(--green-ink)}.d-down{background:var(--pink-soft);color:var(--pink-ink)}
.meter{height:6px;border-radius:3px;background:var(--sub-2);overflow:hidden;flex:1 1 60px;min-width:40px}
.meter i{display:block;height:100%;background:var(--violet);border-radius:3px;width:0;transition:width .8s cubic-bezier(.2,.8,.2,1)}
@media (max-width:1240px){.trow{grid-template-columns:1fr 1fr 1fr 1fr 1fr}.stat .big b{font-size:34px}}
@media (max-width:860px){.trow{grid-template-columns:1fr 1fr}.trow .stat:last-child{grid-column:1/-1}}

.bars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));height:214px;border-top:1px solid var(--line)}
.bcol{position:relative;display:flex;flex-direction:column;border-left:1px solid var(--line);padding:8px 3px 0}
.bcol:first-child{border-left:0}
.bcol .v{font-size:20px;font-weight:800;padding:0 6px;letter-spacing:-.02em}
.bcol .plot{flex:1;display:flex;align-items:flex-end;position:relative}
.bcol .fill{width:100%;height:0;border-radius:16px 16px 6px 6px;transition:height 1s cubic-bezier(.2,.8,.2,1);position:relative}
.f-black{background:var(--solid)}.f-pink{background:var(--pink)}
.f-stripe{background:repeating-linear-gradient(135deg,var(--lav) 0 9px,var(--lav-2) 9px 18px)}
.bcol .dp{position:absolute;left:50%;top:-11px;transform:translateX(-50%);background:var(--pink-soft);color:var(--pink-ink);border:2px solid var(--card);font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap}
.bcol .lab{font-size:12px;color:var(--quiet);padding:8px 6px 0;line-height:1.3}
.bcol.me .lab{color:var(--ink);font-weight:700}

.ins{background:linear-gradient(160deg,var(--panel-1),var(--panel-2));color:#fff;border-radius:var(--r);padding:20px;position:relative;overflow:hidden;min-width:0}
.ins::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 50% at 20% 0%,rgba(255,255,255,.18),transparent 70%);pointer-events:none}
.ins .ct{color:#fff}
.ins .badge{font-family:var(--sans);font-size:11.5px;font-weight:700;background:rgba(255,255,255,.18);border-radius:999px;padding:3px 9px}
.icard{position:relative;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:14px 16px;backdrop-filter:blur(2px)}
.icard+.icard{margin-top:10px}
.icard .ih{display:flex;gap:12px;align-items:flex-start}
.icard .ii{width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;flex:none}
.icard h4{font-size:14.5px;font-weight:700;margin:0;line-height:1.35}
.icard .isub{font-size:12.5px;opacity:.8;margin-top:2px}
.icard p.ib2{font-size:13.5px;opacity:.92;margin-top:8px;line-height:1.5}
.icard ul{margin:8px 0 0;padding-left:18px;font-size:13.5px;opacity:.92}
.icard li+li{margin-top:4px}
.slides{position:relative}
.slide{display:none;animation:fade .45s ease}
.slide.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.segs{display:flex;gap:8px;margin-top:14px}
.segs button{flex:1;height:4px;border-radius:2px;border:0;padding:0;background:rgba(255,255,255,.28);cursor:pointer;position:relative;overflow:hidden}

<div class="frame">

function sizeMap() {

  const pay = (close ? QUEUE : P).map(p => metric(p, "total_reimb").v).filter(v => v > 0);

    [...tabs.children].forEach(b => { const on = b.dataset.k === k; b.setAttribute("aria-selected", String(on)); b.tabIndex = on ? 0 : -1; if (on && focus) { b.focus(); b.scrollIntoView({block: "nearest", inline: "nearest"}); } });
    const m = M[MI[k]], mv = metric(p, k);
    note.textContent = `${m.help} This provider: ${fmt(mv.v, m.unit)}, ${compare(mv.pct, p.care)}.`;
    chart.replaceChildren(histogram(p, k));
  }
  M.forEach(m => tabs.append(h("button", {role: "tab", "data-k": m.key, "aria-selected": "false", onclick: () => show(m.key)}, m.label)));
  tabs.addEventListener("keydown", e => { if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return; e.preventDefault(); e.stopPropagation();
    const i = MI[key] + (e.key === "ArrowRight" ? 1 : -1); show(M[(i + M.length) % M.length].key, true); });
  sec.append(h("div", {class: "ch"}, h("div", {}, h("h2", {class: "ct", id: "exp-h"}, "Explore the data"),
    h("p", {class: "cs"}, `How this provider compares with ${int(O.peer_counts[p.care])} ${peerWord(p.care)} on each measure. Bars show how many similar providers have each value; the pink bar and dashed line are this provider.`))),
    tabs, note, chart);
  const tbl = h("table", {class: "mtable"},
    h("thead", {}, h("tr", {}, h("th", {scope: "col"}, "Measure"), h("th", {scope: "col", class: "num"}, "This provider"),
      h("th", {scope: "col"}, "Compared with similar providers"), h("th", {scope: "col", class: "c-care"}, "Typical range"))),
    h("tbody", {}, M.map(m => { const mv = metric(p, m.key), q = D.peers[p.care].metrics[m.key].q;
      return h("tr", {}, h("td", {}, h("div", {style: "font-weight:700"}, m.label), h("div", {class: "cs", style: "margin:0"}, m.help)),
        h("td", {class: "num", style: "font-weight:800;white-space:nowrap"}, fmt(mv.v, m.unit)),
        h("td", {}, rangeBar(p, m.key), h("div", {class: "cs", style: "margin:0"}, compare(mv.pct, p.care))),
        h("td", {class: "c-care cs", style: "white-space:nowrap"}, `${fmt(q[1], m.unit)} to ${fmt(q[3], m.unit)}`)); })));
  sec.classList.add("tcard");
  sec.append(h("details", {class: "all"}, h("summary", {}, "All measures in a table"), rangeLegend(), h("div", {class: "tw"}, tbl)));
  show(key);

}
function nextCard(p, next) {

  const c = h("section", {class: "card room", "aria-labelledby": "nx-h"});
  if (!q) {
    c.append(h("div", {class: "img"}, h("b", {}, "✓"), h("small", {}, "")), h("h3", {id: "nx-h"}, "End of the queue"),
      h("p", {class: "ty"}, "This is the last provider in this cycle's queue."), h("div", {style: "height:14px"}),
      h("button", {class: "btn solid wide", onclick: () => openProviders()}, "Back to the queue", icon("arrow", 16)));
    return c;
  }
  c.append(h("div", {class: "img"}, h("div", {style: "position:relative;z-index:1"}, h("small", {}, next ? "Next in queue" : "Next to review"), h("b", {}, "#" + q.rank)), avatar(q, 48)),
    h("div", {class: "row", style: "justify-content:space-between;margin-top:14px"}, h("h3", {id: "nx-h", style: "margin:0"}, q.id), recPill(q)),
    h("p", {class: "ty"}, q.care),
    h("div", {class: "subs"}, h("div", {class: "subc"}, h("span", {}, "Total paid"), h("b", {}, money(metric(q, "total_reimb").v))),
      h("div", {class: "subc"}, h("span", {}, "If size ignored"), h("b", {}, "Rank " + int(q.size_free_rank))),
      h("div", {class: "subc full"}, h("span", {}, "Your status"), h("b", {}, STATUS[statusOf(q.id)]))),

}
function copySummary(p) {
  const A = ai(p.id), note = store.get("note:" + p.id, null);
  const lines = [`${p.id} (${p.care}) - rank ${p.rank} of ${N}`,
    `Recommendation: ${p.action ? ACTION[p.action] : "Not in queue"}`,
    `Rank if size is ignored: ${p.size_free_rank}`,
    `Your status: ${STATUS[statusOf(p.id)]}`,
    ...(p.recommendation_check ? ["Note: recommendation flagged to double-check against the size check."] : []),
    "", (A && A.summary) || fallbackSummary(p), "", "Stands out beyond size:",
    ...p.beyond.map(b => `- ${label(b[0])}: ${fmt(b[1], D.driver_names[b[0]].unit)} (${compare(b[2], p.care)})`),
    "", "Main reasons overall:",
    ...p.drivers.map(d => `- ${label(d[0])}: ${fmt(d[2], D.driver_names[d[0]].unit)} (${compare(d[3], p.care)})`),
    ...(note ? ["", "Reviewer note:", note.text] : []),
    "", "This ranking identifies providers to review; it is not evidence of fraud."];
  const txt = lines.join("\n");
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast("Case summary copied"),
    () => { const t = h("textarea", {}, txt); document.body.append(t); t.select(); try { document.execCommand("copy"); toast("Case summary copied"); } catch (e) {} t.remove(); });
}

/* ---------- about ---------- */
function aboutPage() {
  hero(h("h1", {}, "How it works"), h("p", {class: "lead"}, "A short guide for reviewers. No technical background needed."));
  const o = O;
  const items = [
    ["list", "What the ranking is", `Each provider's claims are summarised into measures such as total payments, length of hospital stays and claims per patient. A model trained on providers flagged in the past puts all ${int(o.providers_scored)} providers in order, so the most similar to past flags come first.`],
    ["alert", "What it is not", "It is not a fraud finding. Past flags were suspicions, and how they were assigned is not documented. Every case needs a person to review the records and decide."],
    ["scale", "Why size matters", "Large hospitals bill more of everything, and past flags were more common among large providers. So the dashboard also shows each provider's rank with size set aside. A provider that stays near the top without size bills unusually for its size; one that drops out is in the queue mainly because it is big."],
    ["trend", "How well it has done", `On providers held back for testing, ${o.track_record.top100_previously_flagged} of the top 100 had been flagged before, compared with ${o.track_record.top100_payments_alone} when providers were simply sorted by how much they were paid. ${o.track_record.flagged_in_test} of the ${int(o.providers_scored)} test providers had been flagged.`],
    ["sparkle", "Where the words come from", "Numbers, ranks and charts are calculated directly from the claims. The plain-language explanations for queue providers are written by AI agents and checked automatically: every number they state must match the data, recommendations must not change, and technical terms are not allowed. Panels say whether their text was written by AI or is standard wording."],
    ["pencil", "Your notes", "Status, checklist ticks and notes are kept in this browser only. They are not shared or sent anywhere."],
    ["book", "Data", `Public Medicare benchmark data (Kaggle), claims from ${nice(o.period.from)} to ${nice(o.period.to)}. It appears to be synthetic, so this dashboard is a demonstration.`]];
  $("#app").append(h("div", {class: "about rise"}, items.map(([ic, t, b]) => h("section", {class: "card"}, h("span", {class: "ai"}, icon(ic, 20)), h("div", {}, h("h3", {}, t), h("p", {}, b))))));
}

/* ---------- shell and router ---------- */
function buildShell() {
  $("#logo-ic").append(icon("shield", 18, 2.1));
  const toCheck = () => QUEUE.filter(p => p.recommendation_check && statusOf(p.id) === 0).length;
  const bell = h("button", {class: "ib", onclick: () => openProviders({focus: "check"})}, icon("bell", 18));
  const searchBtn = h("button", {class: "ib", "aria-label": "Find a provider", title: "Find a provider (/)", onclick: focusSearch}, icon("search", 18));
  const dl = h("button", {class: "ib", "aria-label": "Download the ranking as CSV", title: "Download the ranking (CSV)", onclick: exportCsv}, icon("download", 18));
  $("#icons").append(searchBtn, bell, dl);
  buildShell.bell = () => { const n = toCheck(); bell.querySelector(".badge")?.remove(); if (n) bell.append(h("span", {class: "badge", "aria-hidden": "true"}, n));
    bell.setAttribute("aria-label", `${n} recommendation${n === 1 ? "" : "s"} to double-check, not yet started`); bell.title = bell.getAttribute("aria-label"); };
  const meta = D.meta || {};
  $("#foot").append(h("span", {}, `Prepared ${meta.generated || ""}. ${meta.ai_note || "Plain-language explanations: not generated; showing standard wording."}`),
    h("span", {}, "This dashboard ranks providers for review. It does not decide outcomes, and no payment is denied or delayed because of it."));
  const notice = !AI ? "Plain-language explanations have not been generated for this build. Numbers and charts are complete; wording is standard system text."
    : (meta.checks_failed && meta.checks_failed.length) ? `Some AI-written text failed automatic checks (${meta.checks_failed.join(", ")}); that text has been replaced with standard system wording.` : null;
  if (notice) $("#notice").append(h("div", {class: "notice", role: "note"}, icon("info", 18), h("span", {}, notice)));
}
function focusSearch() {
  if (location.hash !== "#/providers") { view.t = Object.assign(DEFAULT_T(), {mode: "all"}); location.hash = "#/providers"; setTimeout(() => $("#q") && $("#q").focus(), 30); }
  else $("#q").focus();
}
function route() {
  timers.forEach(clearTimeout); timers = []; redraws = [];
  const app = $("#app"), hsh = location.hash || "#/";
  $("#tip").style.display = "none";
  app.replaceChildren();
  const m = hsh.match(/^#\/p\/([A-Za-z0-9]+)$/);
  const page = m ? "prov" : hsh === "#/providers" ? "list" : hsh === "#/about" ? "about" : "home";
  [["nav-home", "home"], ["nav-prov", "list"], ["nav-about", "about"]].forEach(([nid, pg]) => {
    const on = pg === page || (pg === "list" && page === "prov"); const a = $("#" + nid);
    if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  if (page === "prov") { providerPage(m[1]); document.title = `${m[1]} · Provider review`; }
  else if (page === "list") { providersPage(); document.title = "Providers · Provider review"; }
  else if (page === "about") { aboutPage(); document.title = "How it works · Provider review"; }
  else { overviewPage(); document.title = "Provider review queue"; }
  buildShell.bell();
  window.scrollTo(0, 0);
  app.focus({preventScroll: true});
}
buildShell();
window.addEventListener("hashchange", route);
document.addEventListener("keydown", e => {
  if (e.target.closest("input,select,textarea,[role=tablist]") || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === "/") { e.preventDefault(); focusSearch(); return; }
  const m = location.hash.match(/^#\/p\/([A-Za-z0-9]+)$/); if (!m) return;
  const i = QUEUE.findIndex(q => q.id === m[1]); if (i < 0) return;
  if (e.key === "ArrowRight" && i < QUEUE.length - 1) go(QUEUE[i + 1].id);
  if (e.key === "ArrowLeft" && i > 0) go(QUEUE[i - 1].id);
});
route();
</script>
