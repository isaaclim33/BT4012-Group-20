<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Provider review queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Mulish:wght@400;500;600;700;800&display=swap">
<style>
/* Visual language: dark hero shell, pill nav, stat tiles, soft status pills, lifted cards (reference A);
   sage page tint, serif card titles, green insights panel, range bars, activity list (reference B). */
:root{
  --bg:#eef1ee;--card:#ffffff;--sub:#f4f6f4;--sub-2:#e8ebe8;--line:#e3e7e3;
  --ink:#0f1116;--ink-2:#4a5160;--quiet:#7f8691;
  --solid:#0f1116;--solid-ink:#ffffff;
  --hero:#0b0e1a;--hero-2:#1a2138;--hero-mute:rgba(255,255,255,.64);--hero-line:rgba(255,255,255,.14);--hero-tile:rgba(255,255,255,.055);
  --violet:#7b5cf6;--violet-hover:#6947ea;--violet-soft:#efebff;--violet-ink:#5f3fe4;--lav:#dcd3ff;--lav-2:#c7b9ff;--lav-ink:#3b2a8a;
  --green:#2fb463;--green-soft:#e1f5e8;--green-ink:#147a3c;
  --amber-soft:#fff1d0;--amber-ink:#9a6200;--amber:#f5b100;
  --pink:#f2477f;--pink-soft:#ffe5ed;--pink-ink:#c81f55;
  --blue-soft:#e5eeff;--blue-ink:#2a60cc;
  --grey-soft:#eef0f2;--grey-ink:#5f6672;
  --panel-1:#6aa56d;--panel-2:#3d7a46;
  --track:#e6eae6;--band:#b9cdb9;--warm:#f6c9bd;--dot:#c5cbd3;
  --sans:"Mulish","Nunito Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --serif:"Lora","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --r:20px;--r-sm:14px;
  --soft:0 1px 2px rgba(15,17,22,.04);
  --lift:0 30px 50px -24px rgba(15,17,22,.38),0 10px 20px -12px rgba(15,17,22,.14);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0d12;--card:#151922;--sub:#1c212b;--sub-2:#262c38;--line:#272d39;
  --ink:#eef0f4;--ink-2:#b8bfcb;--quiet:#8b93a1;--solid:#eef0f4;--solid-ink:#0f1116;
  --hero:#06080e;--hero-2:#151b31;
  --violet-soft:#2a2352;--violet-ink:#bcaaff;--lav:#51458f;--lav-2:#5f52a3;--lav-ink:#ece8ff;
  --green-soft:#15301f;--green-ink:#74dd9c;--amber-soft:#3a2b0b;--amber-ink:#f3c65e;
  --pink-soft:#3e1627;--pink-ink:#ff92b6;--blue-soft:#162949;--blue-ink:#93b7ff;--grey-soft:#242a35;--grey-ink:#a8b0bc;
  --panel-1:#4f8c54;--panel-2:#2a5a31;--track:#2a303c;--band:#4d6650;--warm:#6b3c33;--dot:#465061;
  --soft:0 0 0 1px rgba(255,255,255,.03);--lift:0 30px 50px -24px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --bg:#0b0d12;--card:#151922;--sub:#1c212b;--sub-2:#262c38;--line:#272d39;
  --ink:#eef0f4;--ink-2:#b8bfcb;--quiet:#8b93a1;--solid:#eef0f4;--solid-ink:#0f1116;
  --hero:#06080e;--hero-2:#151b31;
  --violet-soft:#2a2352;--violet-ink:#bcaaff;--lav:#51458f;--lav-2:#5f52a3;--lav-ink:#ece8ff;
  --green-soft:#15301f;--green-ink:#74dd9c;--amber-soft:#3a2b0b;--amber-ink:#f3c65e;
  --pink-soft:#3e1627;--pink-ink:#ff92b6;--blue-soft:#162949;--blue-ink:#93b7ff;--grey-soft:#242a35;--grey-ink:#a8b0bc;
  --panel-1:#4f8c54;--panel-2:#2a5a31;--track:#2a303c;--band:#4d6650;--warm:#6b3c33;--dot:#465061;
  --soft:0 0 0 1px rgba(255,255,255,.03);--lift:0 30px 50px -24px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:6px}
main:focus{outline:none}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{flex:none}
.frame{max-width:1440px;margin:0 auto;padding:20px 24px 28px}

/* ---------- hero shell ---------- */
.hero{position:relative;background:radial-gradient(110% 150% at 88% -30%,var(--hero-2) 0%,var(--hero) 58%);color:#fff;border-radius:26px;padding:14px 24px 26px;isolation:isolate;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(40% 60% at 50% 0%,rgba(123,92,246,.10),transparent 70%);z-index:-1}
.top{display:flex;align-items:center;gap:16px;min-height:52px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;text-decoration:none;color:#fff;white-space:nowrap;letter-spacing:-.01em}
.logo i{width:32px;height:32px;border-radius:50%;background:var(--violet);display:grid;place-items:center;box-shadow:0 0 0 4px rgba(123,92,246,.18)}
.nav{display:flex;gap:4px;margin:0 auto;overflow-x:auto;scrollbar-width:none;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:8px 16px;border-radius:12px;color:var(--hero-mute);text-decoration:none;font-size:13.5px;font-weight:600;white-space:nowrap;transition:background .2s,color .2s}
.nav a:hover{color:#fff;background:rgba(255,255,255,.04)}
.nav a[aria-current=page]{background:rgba(255,255,255,.10);color:#fff}
.icons{display:flex;gap:8px}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--hero-line);background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;position:relative;transition:background .2s,border-color .2s;text-decoration:none}
.ib:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.3)}
.ib .badge{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;border-radius:10px;background:var(--pink);font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid var(--hero);line-height:1}
.hb{padding-top:30px}
.hb-row{display:flex;align-items:flex-end;justify-content:space-between;gap:18px 28px;flex-wrap:wrap}
.hb h1{font-size:clamp(26px,3vw,36px);line-height:1.12;font-weight:800;letter-spacing:-.025em;margin:0}
.hb .lead{color:var(--hero-mute);margin:10px 0 0;max-width:62ch;font-size:15px}
.hact{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;color:#fff;font-size:13.5px;font-weight:600;white-space:nowrap;margin-right:8px}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--violet);color:#fff;border:0;border-radius:14px;padding:12px 20px;font-weight:700;font-size:14px;text-decoration:none;cursor:pointer;transition:background .2s,transform .2s;white-space:nowrap}
.cta:hover{background:var(--violet-hover);transform:translateY(-1px)}
.wpill{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#0f1116;border:0;border-radius:999px;padding:0 16px;height:42px;font-weight:700;font-size:13.5px;cursor:pointer;text-decoration:none;white-space:nowrap}
.wpill select{appearance:none;-webkit-appearance:none;border:0;background:transparent;font-weight:700;font-size:13.5px;color:#0f1116;cursor:pointer;padding-right:4px}
.wpill select:focus-visible{outline:none}
.wpill:focus-within{outline:3px solid var(--lav-2);outline-offset:2px}
.ib.light{background:#fff;color:#0f1116;border-color:#fff;width:42px;height:42px}
.ib.light:hover{background:#e9e9ee}
.ib[aria-disabled=true]{opacity:.35;pointer-events:none}
.crumbs{display:flex;align-items:center;gap:8px;color:var(--hero-mute);font-size:13.5px;flex-wrap:wrap;margin-bottom:14px}
.crumbs a{color:var(--hero-mute);text-decoration:none;display:inline-flex;align-items:center;gap:8px}.crumbs a:hover{color:#fff}
.crumbs b{color:#fff;font-weight:700}
.hb .pls{display:inline-flex;gap:8px;vertical-align:middle;margin-left:12px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:24px}
.tile{background:var(--hero-tile);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr;gap:14px;min-height:98px;color:#fff;text-align:left;font:inherit;min-width:0}
button.tile{cursor:pointer;transition:background .2s,border-color .2s,transform .2s}
button.tile:hover{background:rgba(255,255,255,.09);transform:translateY(-2px)}
.tile[aria-pressed=true]{border-color:rgba(160,138,255,.75);background:rgba(123,92,246,.17)}
.tile .lab{grid-column:1/-1;font-size:13px;font-weight:600;color:rgba(255,255,255,.88)}
.tile .num{font-size:30px;font-weight:800;line-height:1;align-self:end;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .num small{font-size:13px;font-weight:600;color:var(--hero-mute);margin-left:6px;letter-spacing:0}
.tile .ic{align-self:end;width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.ic-violet{background:rgba(123,92,246,.24);color:#c3b5ff}.ic-pink{background:rgba(242,71,127,.2);color:#ff94b8}
.ic-amber{background:rgba(245,177,0,.18);color:#ffcf5c}.ic-green{background:rgba(47,180,99,.2);color:#7fe6a6}
.notice{margin-top:16px;background:var(--amber-soft);color:var(--ink);border-radius:var(--r-sm);padding:12px 16px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.notice svg{color:var(--amber-ink);margin-top:2px}

/* ---------- cards and layout ---------- */
main{display:block;margin-top:16px}
.card{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--soft);min-width:0}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:10px 14px;margin-bottom:16px;flex-wrap:wrap}
.ct{font-family:var(--serif);font-weight:500;font-size:19px;line-height:1.25;margin:0;letter-spacing:-.005em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cs{color:var(--quiet);font-size:13px;margin-top:3px;max-width:70ch}
.count-chip{font-family:var(--sans);font-size:12px;font-weight:700;background:var(--sub);color:var(--ink-2);border-radius:8px;padding:2px 8px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.ov{display:grid;grid-template-columns:minmax(0,2.15fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.pg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.pg .full{grid-column:1/-1}.pg .two{grid-column:span 2}
.pg .panel{grid-column:3;grid-row:1/span 2;align-self:stretch}
@media (max-width:1100px){
  .ov{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stack{display:contents}
  .o1{order:1;grid-column:1/-1}.o2{order:2}.o3{order:3;grid-column:1/-1}.o4{order:4;grid-column:1/-1}.o5{order:5}.o6{order:6;grid-column:1/-1}
  .pg{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pg .panel{grid-column:2;grid-row:1/span 2}
  .pg .two{grid-column:1/-1}
}
@media (max-width:720px){
  .ov,.pg{grid-template-columns:minmax(0,1fr)}
  .ov>*,.pg>*,.pg .panel{grid-column:1/-1!important;grid-row:auto!important}
  .o2b{order:2}
}

/* buttons, pills, inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:10px 16px;font-weight:700;font-size:13.5px;cursor:pointer;text-decoration:none;border:1px solid var(--line);background:var(--card);color:var(--ink);transition:background .2s,color .2s,border-color .2s;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.solid{background:var(--solid);color:var(--solid-ink);border-color:var(--solid)}
.btn.solid:hover{opacity:.9}
.btn.pill{border-radius:999px}
.btn.wide{width:100%}
.btn.sm{padding:7px 12px;font-size:13px}
.circ{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink);transition:background .2s,border-color .2s}
.circ:hover:not(:disabled){border-color:var(--ink-2)}
.circ:disabled{opacity:.35;cursor:default}
.pl{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;line-height:1.35}
.pl-audit{background:var(--pink-soft);color:var(--pink-ink)}
.pl-desk{background:var(--amber-soft);color:var(--amber-ink)}
.pl-mon{background:var(--blue-soft);color:var(--blue-ink)}
.pl-none{background:var(--grey-soft);color:var(--grey-ink)}
.pl-violet{background:var(--violet-soft);color:var(--violet-ink)}
.pl-green{background:var(--green-soft);color:var(--green-ink)}
.pl-pink{background:var(--pink-soft);color:var(--pink-ink)}
.pl-white{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.pl-dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.hero .pl-none{background:rgba(255,255,255,.12);color:#fff}
.sel{position:relative;display:inline-flex;align-items:center}
.sel select{appearance:none;-webkit-appearance:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 34px 8px 14px;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink);max-width:100%}
.sel select:hover{border-color:var(--ink-2)}
.sel svg{position:absolute;right:11px;pointer-events:none;color:var(--quiet)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-width:0;flex:0 1 280px}
.search:focus-within{border-color:var(--violet);box-shadow:0 0 0 3px var(--violet-soft)}
.search input{border:0;background:transparent;padding:9px 0;outline:none;font-weight:600;font-size:13.5px;min-width:0;width:100%}
.search svg{color:var(--quiet)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.av-h{background:var(--violet-soft);color:var(--violet-ink)}
.av-o{background:var(--green-soft);color:var(--green-ink)}
.av-i{background:var(--blue-soft);color:var(--blue-ink)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{font-weight:800;letter-spacing:.01em;white-space:nowrap}
.who small{display:block;color:var(--quiet);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who>div{min-width:0}
.subc{background:var(--sub);border-radius:12px;padding:10px 12px;min-width:0}
.subc>span{display:block;color:var(--quiet);font-size:12px}
.subc b{display:block;font-size:15px;font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;background:var(--solid);color:var(--solid-ink);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;z-index:20;pointer-events:none;transition:opacity .25s,transform .25s;display:flex;gap:8px;align-items:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.tip{position:fixed;pointer-events:none;background:#0f1116;color:#fff;font-size:12.5px;font-weight:600;padding:7px 11px;border-radius:10px;z-index:9;max-width:19rem;display:none;box-shadow:0 10px 24px -10px rgba(0,0,0,.5)}
kbd{font:inherit;font-size:11.5px;font-weight:700;border:1px solid var(--hero-line);border-bottom-width:2px;border-radius:5px;padding:0 5px}

/* ---------- overview ---------- */
.trow{display:grid;grid-template-columns:1fr 1fr 1.45fr 1.45fr 1.45fr;gap:16px}
.trow.trow3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:860px){.trow.trow3{grid-template-columns:1fr 1fr}.trow.trow3>:last-child{grid-column:1/-1}}
.cg{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(300px,1fr);gap:16px;align-items:start}
.cmain{display:flex;flex-direction:column;gap:16px;min-width:0}
.cside{position:sticky;top:16px;display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:900px){.cg{grid-template-columns:minmax(0,1fr)}.cside{position:static}}
.cdet{min-width:0;width:100%}
.cdet>summary{list-style:none;cursor:pointer;background:var(--card);border-radius:var(--r);padding:16px 20px;box-shadow:var(--soft);display:flex;gap:12px;align-items:center;justify-content:space-between}
.cdet>summary::-webkit-details-marker{display:none}
.cdet>summary b{font-family:var(--serif);font-weight:500;font-size:19px}
.cdet[open]>summary{margin-bottom:16px}
.cdet[open]>summary .chev{transform:rotate(180deg)}
.cdet-b{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.cdet-b>.wide{grid-column:1/-1}
@media (max-width:900px){.cdet-b{grid-template-columns:minmax(0,1fr)}}
.cwrap{display:flex;flex-direction:column;gap:16px}
.dopts{display:flex;flex-direction:column;gap:8px}
.dopt{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:10px 12px;cursor:pointer;font-weight:700;font-size:14px}
.dopt small{font-weight:600;opacity:.75}
.dopt:has(input:checked){background:rgba(255,255,255,.24);border-color:#fff}
.kim{margin-top:16px;font-size:13px;color:var(--ink-2)}
.kim ul{margin:6px 0 0;padding-left:18px}.kim li+li{margin-top:3px}
.cnote{display:flex;gap:8px;align-items:center;margin:12px 0 0;font-size:13px;color:var(--amber-ink)}
.cnote svg{flex:none}
.exh{margin:12px 0 0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--sub);font-size:13px}
.exh b{display:block;margin-bottom:4px}.exh ul{margin:0;padding-left:18px}.exh li+li{margin-top:3px}
.slides.static .slide+.slide{margin-top:10px}
.wbar{display:flex;align-items:center;gap:14px 20px;flex-wrap:wrap;background:var(--card);border-radius:var(--r);padding:14px 18px;box-shadow:var(--soft)}
.wbar .wprog{display:flex;align-items:center;gap:10px;min-width:220px;flex:1 1 260px}
.wbar .wprog b{font-size:22px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.wbar .wprog b small{font-size:13px;color:var(--quiet);font-weight:600}
.wbar .wnext{font-size:13.5px;color:var(--ink-2)}
.wbar .wnext a{font-weight:700;color:var(--ink)}
.actd{position:relative}
.actd>summary{list-style:none;cursor:pointer}
.actd>summary::-webkit-details-marker{display:none}
.actd .acts{position:absolute;right:0;top:calc(100% + 8px);z-index:20;width:min(360px,86vw);background:var(--card);border-radius:var(--r-sm);box-shadow:var(--soft),0 12px 32px rgba(0,0,0,.18);padding:8px;margin:0}
.ltabs{display:flex;gap:8px;flex-wrap:wrap}
.ltab{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:700;cursor:pointer}
.ltab small{color:var(--quiet);font-weight:600}
.ltab[aria-pressed=true]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.ltab[aria-pressed=true] small{color:inherit;opacity:.75}
.qt td{padding-top:10px;padding-bottom:10px}
.qt .qcase{display:flex;gap:10px;align-items:flex-start}
.qt .qcase b{display:block}
.qt .qev{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px;line-height:1.4}
.qt .qacts{display:flex;gap:6px;flex-wrap:wrap}
.decisions-table{min-width:820px}
.decisions-table .decision-reason{min-width:180px;max-width:340px;white-space:pre-wrap;overflow-wrap:anywhere}
@container (max-width:620px){.qt .c-pay{display:none}}
.dec .note{padding:8px}
.dec .note textarea{min-height:52px;transition:min-height .15s}
.dec .note textarea:focus,.dec .note textarea.filled{min-height:104px}
.nextln{display:block;margin-top:12px;font-size:13px;color:#fff;opacity:.9}
.nextln b{font-weight:800}
.caselead{font-size:15px;color:var(--hero-mute);margin-top:6px}
.hero.compact .hb{padding-top:16px}
.hero.compact .hb h1{font-size:26px}

.facts .subc b{white-space:normal}
.facts .subc em{font-style:normal;color:var(--ink-2);font-weight:600;font-size:12.5px;display:block}
.recn{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:13.5px;color:var(--ink-2)}
.callout{background:var(--amber-soft);border-radius:14px;padding:12px 14px;margin-top:14px;font-size:13.5px;display:flex;gap:10px}
.callout svg{color:var(--amber-ink);margin-top:2px}
.callout b{display:block;color:var(--ink)}
.list{list-style:none;margin:0;padding:0}
.list li+li{border-top:1px solid var(--line)}
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;cursor:pointer;font-size:13.5px}
.chk .ai{width:38px;height:38px;border-radius:12px;background:var(--sub);display:grid;place-items:center;flex:none;color:var(--ink-2);transition:background .2s,color .2s}
.chk input{position:absolute;opacity:0;pointer-events:none}
.chk input:checked~.ai{background:var(--green-soft);color:var(--green-ink)}
.chk input:checked~span{color:var(--quiet);text-decoration:line-through}
.chk input:focus-visible~.ai{outline:3px solid var(--violet)}
.chk span{padding-top:9px}
.pat summary{list-style:none;display:flex;gap:12px;align-items:center;padding:12px 4px;cursor:pointer}
.pat summary::-webkit-details-marker{display:none}
.pat summary .ai{width:38px;height:38px;border-radius:12px;background:var(--sub);display:grid;place-items:center;flex:none;color:var(--ink-2)}
.pat summary b{display:block;font-size:13.5px;font-weight:700}
.pat summary small{color:var(--quiet);font-size:12px}
.pat summary .chev{margin-left:auto;color:var(--quiet);transition:transform .2s}
.pat[open] summary .chev{transform:rotate(180deg)}
.pat p{font-size:13.5px;color:var(--ink-2);padding:0 4px 14px 54px}
.prog{font-family:var(--sans);font-size:12.5px;color:var(--quiet);font-weight:600}
.fts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.ftile{background:var(--sub);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ftile .fh{display:flex;align-items:center;gap:10px;font-weight:700;font-size:13.5px}
.ftile .fh i{width:30px;height:30px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--green-ink);flex:none}
.ftile .fv{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin-top:4px}
.ftile .fc{font-size:12.5px;color:var(--ink-2)}
.ftile .fw{font-size:13.5px;color:var(--ink-2);margin-top:6px;line-height:1.5}
.frows{list-style:none;margin:0;padding:0}
.frow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:8px 24px;padding:16px 4px;align-items:start}
.frow+.frow{border-top:1px solid var(--line)}
.frow .nm{font-weight:800;font-size:14px}
.frow .vl{font-size:18px;font-weight:800;margin-top:4px;letter-spacing:-.01em}
.frow .cp{font-size:12.5px;color:var(--ink-2)}
.frow .ex{font-size:13.5px;color:var(--ink-2);line-height:1.55}
.frow .row{margin-top:6px}
@media (max-width:560px){.frow{grid-template-columns:minmax(0,1fr)}}
.legend-line{font-size:12.5px;color:var(--quiet);display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:6px}
.legend-line i{display:inline-block;width:18px;height:6px;border-radius:3px;vertical-align:1px;margin-right:6px}

.rng{position:relative;padding-top:8px;margin-top:6px;min-width:0}
.rng-t{position:relative;height:6px;border-radius:3px;background:var(--track)}
.rng-t i{position:absolute;top:0;bottom:0;border-radius:3px}
.rng-out{background:var(--warm)}
.rng-band{background:var(--band)}
.rng-t .rng-med{width:2px;margin-left:-1px;background:var(--ink-2);top:-3px;bottom:-3px;border-radius:1px}
.rng-m{position:absolute;top:15px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:800;white-space:nowrap;line-height:1.2;transition:left .8s cubic-bezier(.2,.8,.2,1)}
.rng-m::before{content:"";border:6px solid transparent;border-bottom:7px solid var(--ink);border-top:0;margin-bottom:3px}
.rng-m.l{transform:translateX(-6px);align-items:flex-start}
.rng-m.r{transform:translateX(calc(-100% + 6px));align-items:flex-end}
.rng-m.hot::before{border-bottom-color:var(--pink-ink)}.rng-m.hot span{color:var(--pink-ink)}
.rng-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--quiet);margin-top:5px;min-height:28px}
.rng-d .rng-t{background:rgba(255,255,255,.28)}
.rng-d .rng-band{background:rgba(255,255,255,.8)}
.rng-d .rng-out{background:rgba(255,170,150,.75)}
.rng-d .rng-t .rng-med{background:#fff}
.rng-d .rng-m::before{border-bottom-color:#fff}
.rng-d .rng-m,.rng-d .rng-m.hot span{color:#fff}
.rng-d .rng-l{color:rgba(255,255,255,.75)}

.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:6px;margin-bottom:10px}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:13px;font-weight:700;white-space:nowrap;color:var(--ink-2);transition:all .15s}
.tabs button:hover{border-color:var(--ink-2)}
.tabs button[aria-selected=true]{background:var(--solid);color:var(--solid-ink);border-color:var(--solid)}
.hist svg{width:100%;height:auto;display:block}
.hist-note{color:var(--ink-2);font-size:13.5px;margin:4px 0 10px}
details.all{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
details.all>summary{cursor:pointer;font-weight:700;font-size:14px}
.mtable{margin-top:10px}
.mtable tbody tr{cursor:default}
.mtable tbody tr:hover td{background:none}
.mtable td{vertical-align:top}
.mtable .rng{min-width:180px}
.room .img{height:138px;border-radius:16px;background:linear-gradient(140deg,var(--violet-soft),var(--green-soft));display:flex;align-items:flex-end;justify-content:space-between;padding:14px 16px;position:relative;overflow:hidden}
.room .img::after{content:"";position:absolute;right:-30px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.35)}
.room .img b{font-family:var(--serif);font-weight:500;font-size:44px;line-height:1;position:relative;z-index:1}
.room .img small{display:block;font-family:var(--sans);font-size:12px;color:var(--ink-2);font-weight:700}
.room h3{font-size:17px;font-weight:800;margin:14px 0 0}
.room .ty{font-size:12.5px;color:var(--quiet)}
.room .subs{margin:14px 0}
.room .subs .full{grid-column:1/-1}
.about{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.about .card{display:flex;gap:14px}
.about .ai{width:42px;height:42px;border-radius:12px;background:var(--sub);display:grid;place-items:center;flex:none;color:var(--violet-ink)}
.about h3{font-family:var(--serif);font-weight:500;font-size:18px;margin:0 0 6px}
.about p{color:var(--ink-2);font-size:14px;line-height:1.6}
@media (max-width:800px){.about{grid-template-columns:minmax(0,1fr)}}
footer{color:var(--quiet);font-size:12.5px;padding:22px 6px 0;display:flex;justify-content:space-between;gap:8px 24px;flex-wrap:wrap}

/* entrance */
.rise>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.rise>*:nth-child(2){animation-delay:.05s}.rise>*:nth-child(3){animation-delay:.1s}.rise>*:nth-child(4){animation-delay:.15s}.rise>*:nth-child(5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* small screens */
@media (max-width:860px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){
  .frame{padding:10px 10px 24px}
  .hero{padding:10px 14px 20px;border-radius:22px}
  .top{gap:8px;flex-wrap:wrap}
  .logo span{display:none}
  .nav{order:3;flex-basis:100%;margin:2px -4px 0}
  .icons{margin-left:auto;gap:6px}
  .ib{width:36px;height:36px}
  .hb{padding-top:18px}
  .tile{min-height:86px;padding:12px}
  .tile .num{font-size:24px;white-space:normal}
  .tile .num small{display:block;margin:4px 0 0}
  .card{padding:16px}
  .hb .pls{margin:8px 0 0;display:flex}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rail{scroll-behavior:auto}}
@media print{.top,.hact,.icons,.toast,.filters,.segs{display:none!important}body{background:#fff}.card,.ins{break-inside:avoid;box-shadow:none}
  .hero{background:#0b0e1a!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>

  if (ks.some(k => /los/.test(k))) out.push("Pull the longest hospital stays and confirm the medical records support each day billed.");
  if (ks.some(k => /reimb|n_claims|n_ip/.test(k))) out.push("Compare payments with the provider's size and bed count before treating volume as a concern.");
  if (ks.some(k => /diag|dgc|admit/.test(k))) out.push("Sample claims and check the diagnoses match the treatment billed.");
  if (ks.some(k => /bene|attending/.test(k))) out.push("Check whether the same patients or doctors appear on an unusual number of claims.");
  if (ks.some(k => /dup/.test(k))) out.push("Look for claims billed twice for the same patient, date and amount.");

}
